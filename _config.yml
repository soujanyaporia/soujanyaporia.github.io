# Site Settings
locale: "en-US"
title: "Soujanya Poria"
title_separator: "-"
subtitle: "Associate Professor, NTU Singapore"
name: "Soujanya Poria"
description: "Associate Professor at Nanyang Technological University, with a courtesy appointment in the College of Computing and Data Science (CCDS). Research on memory for AI agents, continual learning, reliable multi-agent systems, and efficiency, across the DeCLaRe Lab's work on safety, multimodality, AI for science, and embodied AI."
url: "https://soujanyaporia.github.io"
baseurl: ""
repository: "soujanyaporia/soujanyaporia.github.io"

# Author
author:
  name: "Soujanya Poria"
  avatar: "/assets/images/new-SJ-dp.png"
  bio: "Associate Professor, School of Electrical and Electronic Engineering, with a courtesy appointment in the College of Computing and Data Science (CCDS), Nanyang Technological University (NTU)"
  position: "Associate Professor"
  institution: "Nanyang Technological University (NTU)"
  institution_url: "https://www.ntu.edu.sg"
  appointments:
    - name: "School of Electrical and Electronic Engineering"
    - name: "College of Computing and Data Science (CCDS)"
      courtesy: true
  location: "Singapore"
  links:
    - label: "Email"
      icon: "envelope"
      url: "mailto:soujanya.poria@ntu.edu.sg"
    - label: "Lab Website"
      icon: "globe"
      url: "https://declare-lab.github.io"
    - label: "Google Scholar"
      icon: "google-scholar"
      url: "https://scholar.google.co.in/citations?hl=en&user=oS6gRc4AAAAJ&view_op=list_works"
    - label: "DBLP"
      icon: "database"
      url: "https://dblp.org/pid/116/4904"
    - label: "ACL Anthology"
      icon: "book-open"
      url: "https://aclanthology.org/people/soujanya-poria/"
    - label: "GitHub"
      icon: "github"
      url: "https://github.com/soujanyaporia"
    - label: "Twitter"
      icon: "twitter"
      url: "https://twitter.com/soujanyaporia"

# Analytics
analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-H4JB4HZRJ2"

# Build
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6

# Reading Files
include:
  - _pages
exclude:
  - _apps
  - scripts
  - _tools
  # Keep plaintext CV PDFs out of the published site, including local copies.
  - "assets/files/*CV*.pdf"
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - artifacts
  - vendor

keep_files:
  - .git

encoding: "utf-8"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
