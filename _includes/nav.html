<header class="site-header">
  <div class="header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">
      <img class="site-logo theme-logo-light" src="{{ '/assets/images/logos/declare-icon-light.png' | relative_url }}" alt="">
      <img class="site-logo theme-logo-dark" src="{{ '/assets/images/logos/declare-icon-dark.png' | relative_url }}" alt="">
      <span>{{ site.title }}</span>
    </a>
    <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="primary-navigation">
      <i class="fas fa-bars menu-icon-open" aria-hidden="true"></i>
      <i class="fas fa-xmark menu-icon-close" aria-hidden="true"></i>
    </button>
    <nav class="nav-links" id="primary-navigation" aria-label="Primary navigation">
      {%- for link in site.data.navigation.main -%}
        {%- if link.url contains '://' -%}
          <a href="{{ link.url }}" target="_blank" rel="noopener">
            <i class="nav-icon {{ link.icon }}" aria-hidden="true"></i>
            <span>{{ link.title }}</span>
            <i class="nav-external fas fa-arrow-up-right-from-square" aria-hidden="true"></i>
          </a>
        {%- else -%}
          <a href="{{ link.url | relative_url }}" {% if page.url == link.url %}class="active" aria-current="page"{% endif %}>
            <i class="nav-icon {{ link.icon }}" aria-hidden="true"></i>
            <span>{{ link.title }}</span>
          </a>
        {%- endif -%}
      {%- endfor -%}
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Use dark theme">
        <span class="theme-icon" aria-hidden="true">
          <i class="fas fa-sun icon-sun"></i>
          <i class="fas fa-moon icon-moon"></i>
        </span>
        <span class="theme-toggle-label">Appearance</span>
        <span class="theme-toggle-value" aria-hidden="true"></span>
      </button>
    </nav>
  </div>
  <div class="nav-scrim" aria-hidden="true"></div>
</header>
