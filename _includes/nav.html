<header class="site-header">
  <div class="site-header__inner">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="primary-navigation">
      <svg class="menu-toggle__open" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 6.5h14M3 13.5h14"/></svg>
      <svg class="menu-toggle__close" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
    </button>
    <nav class="site-nav" id="primary-navigation" aria-label="Primary navigation">
      {%- for link in site.data.navigation.main -%}
        {%- if link.url contains '://' -%}
          <a class="site-nav__external" href="{{ link.url }}" target="_blank" rel="noopener">{{ link.title }}<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.5 7.5 2.5M3.5 2.5h4v4"/></svg></a>
        {%- else -%}
          <a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
        {%- endif -%}
      {%- endfor -%}
    </nav>
  </div>
</header>
