{% if jekyll.environment == 'production' and site.analytics.provider == 'google-gtag' and site.analytics.google.tracking_id and page.analytics != false %}
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics.google.tracking_id | url_encode }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  // Keep local previews out of the production Analytics property.
  var sendPageView = ['localhost', '127.0.0.1', '[::1]'].indexOf(window.location.hostname) === -1;
  gtag('config', {{ site.analytics.google.tracking_id | jsonify }}, { send_page_view: sendPageView });
</script>
{% endif %}
