---
layout: default
---
<article class="page{% if page.url == '/' %} page--home{% endif %}">
  {% if page.title and page.title != "" %}
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {% if page.intro %}<p class="page-header__intro">{{ page.intro }}</p>{% endif %}
  </header>
  {% endif %}

  <div class="content-text">
    {{ content }}
  </div>
</article>
