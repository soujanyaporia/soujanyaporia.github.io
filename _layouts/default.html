<!doctype html>
<html lang="{{ site.locale | slice: 0,2 | default: 'en' }}">
<head>
  <meta charset="utf-8">
  {% include analytics.html %}
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>{% if page.url == '/' %}{{ site.title }}{% elsif page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/images/favicon.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/images/favicon-64.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/images/favicon-96.png">
  <link rel="icon" type="image/png" sizes="128x128" href="/assets/images/favicon-128.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..600&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Noto+Serif+Bengali:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  {% include head-meta.html %}
</head>
<body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include nav.html %}

  <main class="site-main" id="main" tabindex="-1">
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
