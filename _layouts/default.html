<!doctype html>
<html lang="{{ site.locale | slice: 0,2 | default: 'en' }}" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.url == '/' %}{{ site.title }}{% elsif page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncatewords: 50 }}">
  <link rel="shortcut icon" type="image/png" href="/assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+Bengali:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  {% include nav.html %}

  <main class="site-main">
    {{ content }}
  </main>

  {% include footer.html %}

  <script>
    const toggle = document.getElementById('theme-toggle');
    if (toggle) {
      const saved = localStorage.getItem('theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);

      const updateThemeControl = function() {
        const current = document.documentElement.getAttribute('data-theme');
        toggle.setAttribute('aria-label', current === 'dark' ? 'Use light theme' : 'Use dark theme');
      };

      updateThemeControl();
      toggle.addEventListener('click', function() {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateThemeControl();
      });
    }

    (function() {
      const menuToggle = document.querySelector('.menu-toggle');
      const nav = document.querySelector('.nav-links');
      const scrim = document.querySelector('.nav-scrim');

      if (!menuToggle || !nav || !scrim) return;

      function setMenu(open) {
        nav.classList.toggle('open', open);
        scrim.classList.toggle('open', open);
        document.body.classList.toggle('menu-open', open);
        menuToggle.setAttribute('aria-expanded', String(open));
        menuToggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      }

      menuToggle.addEventListener('click', function() {
        setMenu(menuToggle.getAttribute('aria-expanded') !== 'true');
      });

      scrim.addEventListener('click', function() { setMenu(false); });
      nav.querySelectorAll('a').forEach(function(link) {
        link.addEventListener('click', function() { setMenu(false); });
      });

      document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape' && menuToggle.getAttribute('aria-expanded') === 'true') {
          setMenu(false);
          menuToggle.focus();
        }
      });

      window.addEventListener('resize', function() {
        if (window.innerWidth > 720) setMenu(false);
      });
    })();

    (function() {
      const navConfigs = [
        ...Array.from(document.querySelectorAll('.home-section-nav')).map((nav) => ({
          nav,
          links: Array.from(nav.querySelectorAll('[data-section-nav]'))
        })),
        ...Array.from(document.querySelectorAll('.toc-nav')).map((nav) => ({
          nav,
          links: Array.from(nav.querySelectorAll('.toc-list a[href^="#"]'))
        }))
      ];

      const trackers = navConfigs.map(({ nav, links }) => {
        const isHomeNav = nav.classList.contains('home-section-nav');
        const isTocNav = nav.classList.contains('toc-nav');
        const sections = links
          .map((link) => document.getElementById(link.hash.slice(1)))
          .filter(Boolean);

        if (!links.length || !sections.length) return null;

        let activeId = '';

        function setActiveSection(id) {
          if (!id || id === activeId) return;
          activeId = id;

          links.forEach((link) => {
            const isActive = link.hash === '#' + id;
            link.classList.toggle('is-active', isActive);
            if (isActive) {
              link.setAttribute('aria-current', 'location');
              if (nav.scrollWidth > nav.clientWidth) {
                const navRect = nav.getBoundingClientRect();
                const linkRect = link.getBoundingClientRect();
                const centeredLeft = nav.scrollLeft + linkRect.left - navRect.left - ((nav.clientWidth - linkRect.width) / 2);
                nav.scrollTo({ left: centeredLeft, behavior: 'smooth' });
              }
            } else {
              link.removeAttribute('aria-current');
            }
          });
        }

        function update() {
          const isMobile = window.matchMedia('(max-width: 720px)').matches;
          const marker = Math.min(window.innerHeight * (isMobile ? 0.3 : 0.36), 170);
          const navTop = parseFloat(window.getComputedStyle(nav).top) || 0;
          let current = sections[0].id;

          sections.forEach((section) => {
            if (section.getBoundingClientRect().top <= marker) {
              current = section.id;
            }
          });

          if (window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 24) {
            current = sections[sections.length - 1].id;
          }

          if (isHomeNav || isTocNav) {
            const firstRect = sections[0].getBoundingClientRect();
            const lastRect = sections[sections.length - 1].getBoundingClientRect();
            const shouldDock = firstRect.top <= navTop && lastRect.bottom > navTop + nav.offsetHeight;
            nav.classList.toggle('is-docked', shouldDock);
          }

          setActiveSection(current);
        }

        links.forEach((link) => {
          link.addEventListener('click', function(event) {
            const target = document.getElementById(this.hash.slice(1));
            if (!target) return;

            event.preventDefault();
            const siteHeader = document.querySelector('.site-header');
            const siteHeaderHeight = siteHeader ? siteHeader.getBoundingClientRect().height : 0;
            const horizontalToc = isTocNav && window.matchMedia('(max-width: 960px)').matches;
            const localNavHeight = isHomeNav || horizontalToc ? nav.getBoundingClientRect().height : 0;
            const offset = siteHeaderHeight + localNavHeight + 18;
            const targetTop = window.scrollY + target.getBoundingClientRect().top - offset;

            window.scrollTo({ top: Math.max(0, targetTop), behavior: 'smooth' });
            window.history.pushState(null, '', this.hash);
            setActiveSection(this.hash.slice(1));
          });
        });

        return update;
      }).filter(Boolean);

      if (!trackers.length) return;

      let ticking = false;

      function updateAll() {
        trackers.forEach((update) => update());
        ticking = false;
      }

      function requestUpdate() {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(updateAll);
      }

      updateAll();
      window.addEventListener('scroll', requestUpdate, { passive: true });
      window.addEventListener('resize', requestUpdate);
    })();
  </script>
</body>
</html>
