<!doctype html>
<html class="declare-core" lang="{{ site.locale | slice: 0,2 | default: 'en' }}" data-theme="light">
<head>
  <meta charset="utf-8">
  <!-- Resolve the theme before first paint. Two things were wrong without it:
       the document was hardcoded to light, so a visitor whose system is set to
       dark got a light site until they found the toggle; and a returning dark
       visitor saw a light flash while the deferred script caught up. -->
  <script>
    (function () {
      try {
        var saved = window.localStorage.getItem("theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = saved === "light" || saved === "dark" ? saved : (prefersDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    }());
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.url == '/' %}{{ site.title }}{% elsif page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncatewords: 50 }}">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/images/favicon.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/images/favicon-64.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/images/favicon-96.png">
  <link rel="icon" type="image/png" sizes="128x128" href="/assets/images/favicon-128.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body class="site-layout site-layout--personal{% if page.body_class %} {{ page.body_class }}{% endif %}">
  {% include nav.html %}

  <main class="site-main">
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ '/assets/declare-core/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
