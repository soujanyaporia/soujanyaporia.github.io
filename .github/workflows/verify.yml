name: Verify Jekyll site

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Verify Scholar metadata
        run: |
          bundle exec ruby scripts/sync_scholar_test.rb
          bundle exec ruby scripts/sync_scholar.rb --output _data/scholar.yml --check --max-age 45 --minimum-coverage 0.95
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test publication BibTeX controls
        run: node --test scripts/publications_bibtex.test.cjs
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit generated site
        run: bundle exec ruby scripts/audit_site.rb _site
      - name: Audit content clarity
        run: bundle exec ruby scripts/audit_content.rb _site
      - name: Test maths school API
        working-directory: _apps/math-for-primary/school-api
        run: |
          npm ci
          npm run build
          npm test
      - name: Build and test Singapore Primary Maths
        working-directory: _apps/math-for-primary
        env:
          VITE_CLOUD_SYNC_URL: https://sg-primary-maths-sync.sg-primary-maths-sync.workers.dev
        run: |
          npm ci
          npm test
          npx tsc --noEmit -p cloudflare-worker/tsconfig.json
          npm run build
          mkdir -p ../../_site/singapore-primary-maths ../../_site/math-for-primary
          cp -R dist/. ../../_site/singapore-primary-maths/
          cp -R dist-legacy/. ../../_site/math-for-primary/
          test -f ../../_site/singapore-primary-maths/index.html
          test -f ../../_site/math-for-primary/index.html
      - name: Build and verify public-page sitemap
        run: |
          python -m unittest discover -s _tools -p 'test_indexing_sitemap.py'
          python _tools/build_indexing_sitemap.py --site _site --url https://soujanyaporia.github.io
          python _tools/build_indexing_sitemap.py --site _site --url https://soujanyaporia.github.io --check
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
