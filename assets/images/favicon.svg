<?xml version="1.0" encoding="utf-8"?>
<svg width="747" height="1024" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="34.008 8.029 121.475 166.562" xml:space="preserve" role="img" aria-labelledby="title desc"
  >
<title id="title">DeCLaRe robot icon, light theme</title>
<desc id="desc">The DeCLaRe robot mascot with circular green eye and angular red eye.</desc>
<style type="text/css">
  /* DeCLaRe identity: wordmark purple #7C3AED; green eye
     #1C9444; red angular eye #E22D39. */
  /* Classic robot: one themeable silhouette (currentColor) with interior detail
     carved out via #robot-knockout. */
  .theme { fill: currentColor; font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 500; letter-spacing: .2px; }


  #robot { color: #141413; }
  @media (prefers-color-scheme: dark) { #robot { color: #F5F4EF; } }
</style>

<defs>

  <clipPath id="robot-antenna-clip"><rect x="71.5" y="8.7" width="21.5" height="24.2"/></clipPath>
  <mask id="robot-knockout" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">

    <rect x="34.1" y="167.3" width="121.3" height="7.2" fill="#fff"/>
    <rect x="52.1" y="106.2" width="85.3" height="53.9" fill="#fff"/>
    <rect x="59.3" y="113.4" width="70.9" height="16.15" fill="#000"/>
    <rect x="59.3" y="136.75" width="70.9" height="16.15" fill="#000"/>
    <rect x="84" y="9.9" width="13.7" height="20.7" transform="matrix(0.9301 -0.3673 0.3673 0.9301 -1.0708 34.7719)" fill="#fff"/>
    <path clip-path="url(#robot-antenna-clip)" fill="none" stroke="#000" stroke-width="6" d="M73.9,12.4c3.4,1.8,6.5,4.4,9.3,7.5c2.9,3.3,5.3,7.2,5.8,11.7"/>
    <!-- Head frame as a top bar and two walls, deliberately not one filled
         rect with the window punched through it. Those two rects had bottom
         edges 0.4 apart; they cancel exactly at size, but inside a single
         favicon pixel the black composites over the white instead of
         subtracting, leaving ~20% ink straight across the head that reads as
         a line under the eyes joining the mouth tabs. -->
    <!-- One centreline stroked at the structural 7.2, so the smile cannot
         drift in weight the way two independently drawn outlines did: they
         ran 8.3 at the base and 9.1 nearer the cheeks. Each shoulder keeps a
         mitred corner, matching every other join in the mark. The centreline
         bottoms at 95.4 so the outer edge lands at 99.0, leaving exactly 7.2
         to the panel. -->
    <path fill="none" stroke="#fff" stroke-width="7.2" stroke-linecap="butt"
      stroke-linejoin="miter"
      d="M52.1 72H58C64 81 62 95.4 94.7 95.4C127.4 95.4 125.4 81 131.4 72H137.3"/>
    <rect x="34.1" y="24.6" width="121.3" height="7.2" fill="#fff"/>
    <!-- Wall and cheek as one L, not a wall butted against a tab: the two
         used to meet with a 0.34 seam. -->
    <path fill="#fff" d="M34.1 24.6H41.3V68.4H55.9V75.6H34.1Z"/>
    <path fill="#fff" d="M148.2 24.6H155.4V75.6H133.6V68.4H148.2Z"/>
    <rect x="41.3" y="31.8" width="106.9" height="36.6" fill="#000"/>
  </mask>
  <g id="robot-master">
    <rect x="0" y="0" width="200" height="200" fill="currentColor" mask="url(#robot-knockout)"/>
    <circle cx="72.5" cy="52.5" r="12.9" fill="#1C9444"/>
    <!-- Angular eye as two filled rectangles (matching the head's wall logic):
         a horizontal bar and a diagonal bar sharing a vertical left edge, so
         their intersection reads as a clean square corner, not a beveled cut. -->
    <g fill="#E22D39"><rect x="103.72" y="57.2" width="26.18" height="5.4"/><rect x="0" y="-5.4" width="27" height="5.4" transform="translate(103.72 62.6) rotate(-35.3)"/></g>
  </g>
  
</defs>
<g id="robot"><use xlink:href="#robot-master"/></g>
</svg>
