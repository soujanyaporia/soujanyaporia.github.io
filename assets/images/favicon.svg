<?xml version="1.0" encoding="utf-8"?>
<svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="-9.261 -12.696 208.013 208.013" xml:space="preserve" role="img" aria-labelledby="title desc"
  >
<rect x="-9.261" y="-12.696" width="208.013" height="208.013" fill="#111111"/>
<title id="title">DeCLaRe robot icon, dark theme</title>
<desc id="desc">The DeCLaRe robot mascot with circular green eye and angular red eye.</desc>
<style type="text/css">
  /* DeCLaRe identity: one ink, currentColor. The eyes are holes in the
     visor rather than painted shapes, so nothing carries its own colour. */
  /* Classic robot: one themeable silhouette (currentColor) with interior detail
     carved out via #robot-knockout. */
  .theme { fill: currentColor; font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 500; letter-spacing: .2px; }

</style>

<defs>

  <clipPath id="robot-antenna-clip"><rect x="71.5" y="8.7" width="21.5" height="24.2"/></clipPath>
  <mask id="robot-knockout" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
    <!-- The smile is the authored outline, untouched. Its inner edge is the
         same outline scaled about the face centre. That closes the notch where
         the cheek meets the arc, joining them into one form, and it holds the
         ring at 7.2 within 0.26. The visible outer curve does not move. -->
    <path fill="#fff" d="M94.7,11.2c0.2,0,5.3,0,10.5,0.5c17.2,2.1,30.7,15.6,32.8,32.8c0.5,5.2,0.5,10.3,0.5,10.5c0,0.2,0,5.3-0.5,10.5c-2.1,17.2-15.6,30.7-32.8,32.8c-5.2,0.5-10.3,0.5-10.5,0.5c-0.2,0-5.3,0-10.5-0.5c-17.2-2.1-30.7-15.6-32.8-32.8c-0.5-5.2-0.5-10.3-0.5-10.5c0-0.2,0-5.3,0.5-10.5c2.1-17.2,15.6-30.7,32.8-32.8C89.4,11.2,94.5,11.2,94.7,11.2z"/>
    <path fill="#000" d="M94.7,18.2914c0.1676,0,4.4419,0,8.8,0.419c14.4152,1.76,25.7295,13.0743,27.4895,27.4895c0.419,4.3581,0.419,8.6324,0.419,8.8c0,0.1676,0,4.4419-0.419,8.8c-1.76,14.4152-13.0743,25.7295-27.4895,27.4895c-4.3581,0.419-8.6324,0.419-8.8,0.419c-0.1676,0-4.4419,0-8.8-0.419c-14.4152-1.76-25.7295-13.0743-27.4895-27.4895c-0.419-4.3581-0.419-8.6324-0.419-8.8c0-0.1676,0-4.4419,0.419-8.8c1.76-14.4152,13.0743-25.7295,27.4895-27.4895C90.2581,18.2914,94.5324,18.2914,94.7,18.2914z"/>
    <rect x="43.7" y="1" width="102" height="66.2" fill="#000"/>

    <rect x="34.1" y="167.3" width="121.3" height="7.2" fill="#fff"/>
    <rect x="52.1" y="106.2" width="85.3" height="53.9" fill="#fff"/>
    <rect x="59.3" y="113.4" width="70.9" height="16.15" fill="#000"/>
    <rect x="59.3" y="136.75" width="70.9" height="16.15" fill="#000"/>
    <rect x="84" y="9.9" width="13.7" height="20.7" transform="matrix(0.9301 -0.3673 0.3673 0.9301 -1.0708 34.7719)" fill="#fff"/>
    <path clip-path="url(#robot-antenna-clip)" fill="none" stroke="#000" stroke-width="6" d="M73.9,12.4c3.4,1.8,6.5,4.4,9.3,7.5c2.9,3.3,5.3,7.2,5.8,11.7"/>
    <!-- The head is one solid visor: the roof of 宣 drawn as a block, with the
         two cheeks dropping 7.2 below it to meet the smile. Between the
         cheeks its lower edge is the upper lip, a curve that leaves the
         mouth open 2.5 strokes (18.0) at the centre, so the mouth reads as
         a smile rather than a bowl. One path rather than a bar, two walls
         and a window, which is what used to leave seams. -->
    <path fill="#fff" d="M34.1 24.6H155.4V75.6H133.6V68.4Q94.75 79.02 55.9 68.4V75.6H34.1Z"/>
    <!-- The eyes are holes in the visor, so the robot is one ink and the
         eyes show whatever is behind it. The round eye keeps one full 7.2
         stroke of visor above and below it, which stops it breaking into
         the smile at small sizes. -->
    <circle cx="72.5" cy="46.5" r="14.7" fill="#000"/>
    <!-- The wink: a flat lower lid and a 30 degree upper lid, each one 7.2
         stroke, with every cut vertical or horizontal so it shares the
         square geometry of the visor and body. It mirrors the round eye
         about the face's centre line: 29.4 wide, 23.7 in from the visor
         edge, its centre 0.2 above the round eye's. -->
    <g fill="#000"><path d="M102.30 58.94H131.70V51.74H114.77L131.70 41.97V33.66L102.30 50.63Z"/></g>
  </mask>
  <g id="robot-master">
    <rect x="0" y="0" width="200" height="200" fill="currentColor" mask="url(#robot-knockout)"/>
  </g>
  
</defs>
<g id="robot" style="color:#FFFFFF"><use xlink:href="#robot-master"/></g>
</svg>
